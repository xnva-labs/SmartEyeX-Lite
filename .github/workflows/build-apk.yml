name: Build SmartEyeX Lite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: 34.0.0
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Create gradle wrapper directory
      run: mkdir -p gradle/wrapper
    
    - name: Download gradle-wrapper.jar
      run: |
        wget -O gradle/wrapper/gradle-wrapper.jar https://github.com/gradle/gradle/raw/master/gradle/wrapper/gradle-wrapper.jar
    
    - name: Verify gradle-wrapper.jar exists
      run: ls -lh gradle/wrapper/gradle-wrapper.jar
    
    - name: Build APK
      run: ./gradlew assembleDebug --no-daemon --stacktrace
    
    - name: Upload APK
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SmartEyeX-Lite-Debug
        path: app/build/outputs/apk/debug/
        retention-days: 30
