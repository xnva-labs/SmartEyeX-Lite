name: Build SmartEyeX Lite APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle
    
    - name: Setup Android SDK
      uses: android-actions/setup-android@v3
      with:
        api-level: 34
        build-tools-version: 34.0.0
    
    - name: Make gradlew executable
      run: chmod +x ./gradlew
    
    - name: Download Gradle wrapper
      run: |
        mkdir -p gradle/wrapper
        wget https://services.gradle.org/distributions/gradle-8.5-all.zip -O gradle-wrapper.zip
        unzip -o gradle-wrapper.zip -d gradle/wrapper/
        ls -la gradle/wrapper/
    
    - name: Build with Gradle
      run: ./gradlew clean build -x test --stacktrace
    
    - name: Assemble Debug APK
      run: ./gradlew assembleDebug --stacktrace
    
    - name: Upload APK Artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: SmartEyeX-Lite-APK
        path: app/build/outputs/apk/debug/
        retention-days: 30
